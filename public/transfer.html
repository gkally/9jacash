<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money | 9jacash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #6a1cb0;
            --accent: #00d4ff;
            --gold: #ffd700;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(22, 22, 38, 0.92);
            --text-light: #ffffff;
            --text-gray: #a8a8c8;
            --border-radius: 18px;
            --box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 15% 20%, #1e1b3a 0%, #0a0a1a 55%, #060610 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: var(--primary);
            top: -140px;
            left: -120px;
            animation: floatOrb 16s ease-in-out infinite alternate;
        }

        body::after {
            width: 460px;
            height: 460px;
            background: var(--accent);
            bottom: -180px;
            right: -140px;
            animation: floatOrb 20s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(40px, -30px) scale(1.08); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.2rem 1.8rem;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.9s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(28px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.6rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-icon-wrapper {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(138, 43, 226, 0.35);
        }

        .logo-icon {
            font-size: 1.2rem;
            color: var(--gold);
        }

        .logo-text span {
            color: var(--gold);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-gray);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .back-btn:hover {
            color: var(--accent);
            background: rgba(0, 212, 255, 0.12);
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            background: linear-gradient(90deg, #ffffff, var(--accent), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.88rem;
            margin-bottom: 1.4rem;
        }

        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.82rem;
            color: var(--text-light);
            letter-spacing: 0.3px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i.input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            z-index: 1;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-with-icon input,
        .input-with-icon select {
            width: 100%;
            padding: 0.9rem 2.8rem 0.9rem 2.8rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            appearance: none;
            -webkit-appearance: none;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .input-with-icon input:focus,
        .input-with-icon select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(138, 43, 226, 0.08);
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.18);
        }

        .input-with-icon input:focus + i.input-icon,
        .input-with-icon select:focus + i.input-icon,
        .input-with-icon input:not(:placeholder-shown) + i.input-icon {
            color: var(--accent);
        }

        .input-with-icon input::placeholder {
            color: rgba(168, 168, 200, 0.6);
        }

        /* Dropdown arrow */
        .select-arrow {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            pointer-events: none;
            font-size: 0.8rem;
        }

        /* Resolved account box */
        .resolved-box {
            display: none;
            background: rgba(39, 174, 96, 0.12);
            border: 1px solid rgba(39, 174, 96, 0.35);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease;
        }

        .resolved-box.show {
            display: block;
        }

        .resolved-box .resolved-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-gray);
            margin-bottom: 0.2rem;
        }

        .resolved-box .resolved-name {
            font-size: 1rem;
            font-weight: 700;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .resolved-box .resolved-name i {
            font-size: 0.9rem;
        }

        .resolving {
            display: none;
            align-items: center;
            gap: 0.6rem;
            color: var(--accent);
            font-size: 0.82rem;
            margin-bottom: 1rem;
            padding: 0.6rem 0.9rem;
            background: rgba(0, 212, 255, 0.08);
            border-radius: 10px;
            border: 1px dashed rgba(0, 212, 255, 0.35);
        }

        .resolving.show {
            display: flex;
        }

        .spinner-sm {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 212, 255, 0.25);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Coupon field hidden by default */
        #couponGroup {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
            box-shadow: 0 8px 22px rgba(138, 43, 226, 0.4);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(138, 43, 226, 0.55);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Messages */
        .message {
            display: none;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .message.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(231, 76, 60, 0.35);
        }

        .message.success {
            display: block;
            background: rgba(39, 174, 96, 0.15);
            color: #4caf50;
            border: 1px solid rgba(39, 174, 96, 0.35);
        }

        .message a.action-link {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }

        .deposit-link {
            background: linear-gradient(135deg, var(--accent), #0099cc);
            color: #06121a;
            box-shadow: 0 5px 14px rgba(0, 212, 255, 0.35);
        }

        .deposit-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.5);
        }

        .coupon-link {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
            box-shadow: 0 5px 14px rgba(231, 76, 60, 0.35);
        }

        .coupon-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.5);
        }

        .approve-btn {
            display: none;
            width: 100%;
            margin-top: 0.9rem;
            padding: 0.9rem;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            text-align: center;
            transition: var(--transition);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
        }

        .approve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 211, 102, 0.5);
        }

        .support-line {
            text-align: center;
            margin-top: 1.4rem;
            font-size: 0.78rem;
            color: var(--text-gray);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.6rem;
            border-radius: 10px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
        }

        .support-line strong {
            color: var(--gold);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.8rem;
            }

            .container {
                padding: 1.8rem 1.3rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            .input-with-icon input,
            .input-with-icon select {
                font-size: 16px; /* prevent iOS zoom */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon-wrapper">
                    <i class="fas fa-wallet logo-icon"></i>
                </div>
                <span class="logo-text">9ja<span>cash</span></span>
            </div>
            <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>

        <h2>Transfer Money</h2>
        <p class="subtitle">Send money to any Nigerian bank account securely.</p>

        <!-- Receiver name (auto-filled via API) -->
        <div class="form-group">
            <label for="receiverName">Receiver's Name</label>
            <div class="input-with-icon">
                <input type="text" id="receiverName" placeholder="Auto-detected from account number" autocomplete="off">
                <i class="fas fa-user input-icon"></i>
            </div>
        </div>

        <!-- Account number -->
        <div class="form-group">
            <label for="receiverAccount">Receiver's Account Number</label>
            <div class="input-with-icon">
                <input type="tel" id="receiverAccount" placeholder="Enter 10-digit account number" maxlength="10" inputmode="numeric" autocomplete="off">
                <i class="fas fa-hashtag input-icon"></i>
            </div>
        </div>

        <!-- Bank dropdown -->
        <div class="form-group">
            <label for="bank">Select Bank</label>
            <div class="input-with-icon">
                <select id="bank">
                    <option value="">-- Choose your bank --</option>
                </select>
                <i class="fas fa-university input-icon"></i>
                <i class="fas fa-chevron-down select-arrow"></i>
            </div>
        </div>

        <!-- Resolving indicator -->
        <div class="resolving" id="resolving">
            <div class="spinner-sm"></div>
            <span>Verifying account details…</span>
        </div>

        <!-- Resolved account name display -->
        <div class="resolved-box" id="resolvedBox">
            <div class="resolved-label">Verified Account Name</div>
            <div class="resolved-name">
                <i class="fas fa-check-circle"></i>
                <span id="resolvedName"></span>
            </div>
        </div>

        <!-- Amount -->
        <div class="form-group">
            <label for="amount">Amount (₦)</label>
            <div class="input-with-icon">
                <input type="number" id="amount" placeholder="Minimum ₦100,000" min="100000" inputmode="numeric">
                <i class="fas fa-naira-sign input-icon"></i>
            </div>
        </div>

        <!-- Coupon (hidden until first submit) -->
        <div class="form-group" id="couponGroup">
            <label for="coupon">Withdrawal Coupon</label>
            <div class="input-with-icon">
                <input type="text" id="coupon" placeholder="Enter withdrawal coupon" autocomplete="off">
                <i class="fas fa-ticket-alt input-icon"></i>
            </div>
        </div>

        <!-- Submit -->
        <button class="btn" id="sendBtn" onclick="sendMoney()">
            <i class="fas fa-paper-plane"></i>
            Send Money
        </button>

        <!-- Messages -->
        <div class="message" id="errorMessage"></div>
        <div class="message" id="successMessage"></div>

        <!-- Approve payment WhatsApp link -->
        <a id="approveButton" class="approve-btn" href="#" target="_blank" rel="noopener">
            <i class="fab fa-whatsapp"></i> Approve Payment via WhatsApp
        </a>

        <div class="support-line">
            📞 Customer Support / WhatsApp: <strong>+44 7448 774304</strong>
        </div>
    </div>

    <script>
        /* ============================================================
           CONFIGURATION
           ============================================================ */
        // Public bank list (Paystack-supported banks)
        const BANKS = [
            { name: "Access Bank",        code: "044" },
            { name: "Citibank",           code: "023" },
            { name: "Ecobank",            code: "050" },
            { name: "Fidelity Bank",      code: "070" },
            { name: "First Bank",         code: "011" },
            { name: "FCMB",               code: "214" },
            { name: "GTBank",             code: "058" },
            { name: "Kuda Bank",          code: "50211" },
            { name: "Opay",               code: "999992" },
            { name: "Palmpay",            code: "999991" },
            { name: "Moniepoint",         code: "50515" },
            { name: "UBA",                code: "033" },
            { name: "Union Bank",         code: "032" },
            { name: "Zenith Bank",        code: "057" },
            { name: "Wema Bank",          code: "035" },
            { name: "Sterling Bank",      code: "232" },
            { name: "Stanbic IBTC",       code: "221" },
            { name: "Polaris Bank",       code: "076" },
            { name: "Providus Bank",      code: "101" },
            { name: "Keystone Bank",      code: "082" }
        ];

        // ⚠️ Replace with your own Paystack PUBLIC key (pk_test_xxx or pk_live_xxx)
        // You can get one free at https://dashboard.paystack.com/#/settings/developer
        const PAYSTACK_PUBLIC_KEY = "pk_test_REPLACE_WITH_YOUR_PAYSTACK_PUBLIC_KEY";

        const SUPPORT_NUMBER = "447448774304"; // WhatsApp support
        const COUPON_CODE = "9JA338989";

        /* ============================================================
           STATE
           ============================================================ */
        let resolvedAccountName = null;
        let resolvingTimeout = null;

        /* ============================================================
           DOM HELPERS
           ============================================================ */
        const $ = (id) => document.getElementById(id);

        function showMessage(el, html, type) {
            el.innerHTML = html;
            el.className = "message " + type;
            el.style.display = "block";
        }

        function clearMessages() {
            const e = $("errorMessage");
            const s = $("successMessage");
            e.style.display = "none";
            s.style.display = "none";
            e.innerHTML = "";
            s.innerHTML = "";
        }

        /* ============================================================
           POPULATE BANKS
           ============================================================ */
        (function populateBanks() {
            const select = $("bank");
            BANKS.forEach((b) => {
                const opt = document.createElement("option");
                opt.value = b.code;                 // store code as value
                opt.dataset.name = b.name;          // keep name for reference
                opt.textContent = b.name;
                select.appendChild(opt);
            });
        })();

        /* ============================================================
           ACCOUNT RESOLUTION (Paystack Resolve Account API)
           ============================================================ */
        function resetResolved() {
            resolvedAccountName = null;
            $("resolvedBox").classList.remove("show");
            $("resolvedName").textContent = "";
            $("resolving").classList.remove("show");
            $("receiverName").value = "";
        }

        async function resolveAccount() {
            const accountNumber = $("receiverAccount").value.trim();
            const bankCode = $("bank").value;

            // Reset first
            $("resolvedBox").classList.remove("show");
            $("resolvedName").textContent = "";
            resolvedAccountName = null;

            // Only attempt when we have both fields & valid account length
            if (accountNumber.length !== 10 || !/^\d{10}$/.test(accountNumber) || !bankCode) {
                $("resolving").classList.remove("show");
                return;
            }

            // If Paystack key not configured, fall back gracefully
            if (!PAYSTACK_PUBLIC_KEY || PAYSTACK_PUBLIC_KEY.includes("REPLACE")) {
                // Fallback: use a placeholder name based on bank (still gives feedback)
                $("resolving").classList.add("show");
                setTimeout(() => {
                    $("resolving").classList.remove("show");
                    // Simulated demo name (only when no API key is set)
                    resolvedAccountName = "ACCOUNT NAME (CONNECT PAYSTACK KEY)";
                    $("resolvedName").textContent = resolvedAccountName;
                    $("resolvedBox").classList.add("show");
                    $("receiverName").value = resolvedAccountName;
                }, 900);
                return;
            }

            // Show resolving spinner
            $("resolving").classList.add("show");

            try {
                // Use Paystack public Resolve Account endpoint
                const url = `https://api.paystack.co/bank/resolve?account_number=${accountNumber}&bank_code=${bankCode}`;
                const response = await fetch(url, {
                    headers: {
                        "Authorization": `Bearer ${PAYSTACK_PUBLIC_KEY}`
                    }
                });

                const data = await response.json();

                $("resolving").classList.remove("show");

                if (data.status && data.data && data.data.account_name) {
                    resolvedAccountName = data.data.account_name;
                    $("resolvedName").textContent = resolvedAccountName;
                    $("resolvedBox").classList.add("show");
                    $("receiverName").value = resolvedAccountName;
                } else {
                    // Account could not be resolved — show subtle error
                    const msg = data.message || "Could not resolve account. Please confirm the number and bank.";
                    showMessage($("errorMessage"), `<i class="fas fa-exclamation-triangle"></i> ${msg}`, "error");
                }
            } catch (err) {
                console.error("Account resolution error:", err);
                $("resolving").classList.remove("show");
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-exclamation-triangle"></i> Unable to verify account right now. You may continue manually.`,
                    "error"
                );
            }
        }

        /* ============================================================
           EVENT LISTENERS FOR AUTO-RESOLUTION
           ============================================================ */
        $("receiverAccount").addEventListener("input", function () {
            // digits only
            this.value = this.value.replace(/\D/g, "").slice(0, 10);
            clearMessages();

            // Debounce
            clearTimeout(resolvingTimeout);
            if (this.value.length === 10 && $("bank").value) {
                resolvingTimeout = setTimeout(resolveAccount, 500);
            } else {
                resetResolved();
            }
        });

        $("bank").addEventListener("change", function () {
            clearMessages();
            if ($("receiverAccount").value.length === 10 && this.value) {
                resolveAccount();
            } else {
                resetResolved();
            }
        });

        /* ============================================================
           SEND MONEY LOGIC
           ============================================================ */
        async function sendMoney() {
            clearMessages();
            $("approveButton").style.display = "none";

            const accountInput = $("receiverAccount");
            const bankSelect = $("bank");
            const amountInput = $("amount");
            const couponGroup = $("couponGroup");
            const couponInput = $("coupon");

            const accountNumber = accountInput.value.trim();
            const bankCode = bankSelect.value;
            const bankName = bankSelect.options[bankSelect.selectedIndex]?.dataset?.name || "";
            const amount = parseFloat(amountInput.value);
            const receiverName = resolvedAccountName || $("receiverName").value.trim();

            /* ---- Basic validation ---- */
            if (!receiverName || !accountNumber || !bankCode || !amount) {
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-exclamation-circle"></i> Please fill in all fields and ensure the account name is resolved.`,
                    "error"
                );
                return;
            }

            if (accountNumber.length !== 10) {
                showMessage($("errorMessage"), `<i class="fas fa-exclamation-circle"></i> Account number must be 10 digits.`, "error");
                return;
            }

            if (amount < 100000) {
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-exclamation-circle"></i> Minimum transfer amount is ₦100,000 for first-time users.`,
                    "error"
                );
                return;
            }

            /* ---- Check coupon first if already shown ---- */
            const couponVisible = couponGroup.style.display === "block";

            if (couponVisible) {
                const coupon = couponInput.value.trim();
                if (coupon !== COUPON_CODE) {
                    showMessage(
                        $("errorMessage"),
                        `<i class="fas fa-times-circle"></i> Incorrect coupon! Please buy a valid coupon.
                        <br><a class="action-link coupon-link" target="_blank" rel="noopener"
                            href="https://wa.me/${SUPPORT_NUMBER}?text=${encodeURIComponent("Hello 9jacash Support, I need to buy a withdrawal coupon.")}">
                            <i class="fab fa-whatsapp"></i> Buy Coupon
                        </a>`,
                        "error"
                    );
                    return;
                }
            }

            /* ---- Balance check ---- */
            let balance = null;
            try {
                const res = await fetch("/balance", { credentials: "include" });
                if (res.ok) {
                    const data = await res.json();
                    balance = Number(data.balance);
                }
            } catch (err) {
                console.error("Balance fetch error:", err);
            }

            if (balance !== null && amount > balance) {
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-wallet"></i> Insufficient funds! Kindly deposit to your account.
                    <br><a class="action-link deposit-link" href="add.html">
                        <i class="fas fa-plus-circle"></i> Deposit Now
                    </a>`,
                    "error"
                );
                return;
            }

            /* ---- If coupon not yet shown, reveal it and stop ---- */
            if (!couponVisible) {
                couponGroup.style.display = "block";
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-ticket-alt"></i> Please enter your withdrawal coupon to proceed.`,
                    "error"
                );
                return;
            }

            /* ---- Execute transfer ---- */
            const sendBtn = $("sendBtn");
            const originalBtn = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…';
            sendBtn.disabled = true;

            try {
                const response = await fetch("/transfer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        receiverName,
                        receiverAccount: accountNumber,
                        bank: bankName || bankCode,
                        amount
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Transfer failed.");
                }

                /* ---- Success ---- */
                showMessage(
                    $("successMessage"),
                    `<i class="fas fa-check-circle"></i> Transfer successful! To finalise, pay the 10% (₦10,000) approval fee to 9jacash Admin and complete your KYC verification.`,
                    "success"
                );

                const whatsappMessage = `Hello 9jacash Support, I just transferred ₦${amount.toLocaleString()} from my 9jacash account. Please send the account to pay my ₦10,000 approval fee and approve my payment.`;
                const approveBtn = $("approveButton");
                approveBtn.href = `https://wa.me/${SUPPORT_NUMBER}?text=${encodeURIComponent(whatsappMessage)}`;
                approveBtn.style.display = "block";

            } catch (err) {
                showMessage(
                    $("errorMessage"),
                    `<i class="fas fa-times-circle"></i> ${err.message || "Something went wrong. Please try again."}`,
                    "error"
                );
            } finally {
                sendBtn.innerHTML = originalBtn;
                sendBtn.disabled = false;
            }
        }

        /* ============================================================
           CLEAR ON LOAD
           ============================================================ */
        window.addEventListener("DOMContentLoaded", () => {
            resetResolved();
            clearMessages();
        });
    </script>
</body>
</html>
