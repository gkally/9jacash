<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | 9jacash</title>
    <link rel="icon" type="image/jpeg" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8j90HzeSN5ZFtbO39u_6YAjx_cZL24W8_AaKjcBXh0m4qKafOZ1cDhEQ&s=10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #6a1cb0;
            --accent: #00d4ff;
            --gold: #ffd700;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(22, 22, 38, 0.95);
            --text-light: #ffffff;
            --text-gray: #a8a8c8;
            --border-radius: 18px;
            --box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 15% 20%, #1e1b3a 0%, #0a0a1a 55%, #060610 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 450px;
            height: 450px;
            background: var(--primary);
            top: -150px;
            left: -120px;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: var(--accent);
            bottom: -200px;
            right: -150px;
            animation: floatOrb 22s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(40px, -40px) scale(1.08); }
            100% { transform: translate(-40px, 40px) scale(0.95); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ============ LOGIN SCREEN ============ */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 3rem 2.5rem;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(20px);
            animation: fadeIn 0.6s ease-out;
        }

        .login-card i {
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        .login-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-card input {
            width: 100%;
            padding: 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            margin-bottom: 1.2rem;
            text-align: center;
            letter-spacing: 8px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2);
        }

        .btn {
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(138, 43, 226, 0.5);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ============ DASHBOARD SCREEN ============ */
        #dashboardScreen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.2rem 1.5rem;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--box-shadow);
        }

        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .header h1 i {
            color: var(--gold);
        }

        .header h1 span {
            color: var(--gold);
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.15);
            color: #ff6b6b;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(231, 76, 60, 0.3);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.25);
            transform: translateY(-1px);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            padding: 0.8rem;
            border-radius: 12px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 6px 16px rgba(138, 43, 226, 0.4);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(15px);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        /* ============ USERS TABLE ============ */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.9rem;
        }

        th {
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            background: rgba(0, 212, 255, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .action-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            margin-right: 0.3rem;
            margin-bottom: 0.3rem;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .btn-credit { background: rgba(39, 174, 96, 0.2); color: #4caf50; }
        .btn-credit:hover { background: rgba(39, 174, 96, 0.35); }
        .btn-debit { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; }
        .btn-debit:hover { background: rgba(231, 76, 60, 0.35); }
        .btn-activate { background: rgba(0, 212, 255, 0.15); color: var(--accent); }
        .btn-activate:hover { background: rgba(0, 212, 255, 0.3); }
        .btn-deactivate { background: rgba(255, 215, 0, 0.15); color: var(--gold); }
        .btn-deactivate:hover { background: rgba(255, 215, 0, 0.3); }
        .btn-pin { background: rgba(138, 43, 226, 0.2); color: #b57cff; }
        .btn-pin:hover { background: rgba(138, 43, 226, 0.4); }

        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-active { background: rgba(39, 174, 96, 0.15); color: #4caf50; }
        .status-inactive { background: rgba(231, 76, 60, 0.15); color: #ff6b6b; }

        /* ============ PAYCODE FORM ============ */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(168, 168, 200, 0.5);
        }

        .result-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.8rem;
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.1), rgba(0, 212, 255, 0.05));
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 14px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .result-box.active {
            display: block;
        }

        .result-box h3 {
            color: var(--success);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .result-box p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .code-display {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: #000;
            color: var(--gold);
            padding: 1rem;
            border-radius: 12px;
            user-select: all;
            border: 1px dashed rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }

        .code-display:hover {
            background: #111;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .copy-hint {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 1rem; text-align: center; }
            .tabs { flex-direction: column; }
            .tab-btn { justify-content: flex-start; padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. LOGIN SCREEN -->
        <div id="loginScreen">
            <div class="login-card">
                <i class="fas fa-user-shield"></i>
                <h2>Admin Access</h2>
                <p>Enter your 6-digit PIN to access the admin panel.</p>
                <input type="password" id="adminPin" placeholder="••••••" maxlength="6" inputmode="numeric">
                <button class="btn" id="loginBtn" onclick="loginAdmin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p id="loginError" style="color: #ff6b6b; margin-top: 1rem; display: none; font-size: 0.85rem;"></p>
            </div>
        </div>

        <!-- 2. DASHBOARD SCREEN -->
        <div id="dashboardScreen">
            <div class="header">
                <h1><i class="fas fa-crown"></i> 9ja<span>cash</span> Admin</h1>
                <button class="logout-btn" onclick="logoutAdmin()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('usersTab', this)">
                    <i class="fas fa-users"></i> Manage Users
                </button>
                <button class="tab-btn" onclick="switchTab('paycodeTab', this)">
                    <i class="fas fa-ticket-alt"></i> Pay Code Generator
                </button>
            </div>

            <!-- TAB 1: Users Management -->
            <div id="usersTab" class="tab-content active">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersList">
                            <tr><td colspan="5" style="text-align: center; padding: 2rem;">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: Pay Code Generator -->
            <div id="paycodeTab" class="tab-content">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.3rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-magic" style="color: var(--gold);"></i> Generate Payment Code
                </h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="pc_username" placeholder="User's full name">
                    </div>
                    <div class="form-group">
                        <label>Amount (₦)</label>
                        <input type="number" id="pc_amount" placeholder="e.g. 10000">
                    </div>
                    <div class="form-group">
                        <label>Receiver Account Number</label>
                        <input type="text" id="pc_accountNumber" placeholder="10-digit account number">
                    </div>
                    <div class="form-group">
                        <label>Receiver Account Name</label>
                        <input type="text" id="pc_accountName" placeholder="e.g. RUFUS GABRIEL">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Bank Name</label>
                        <input type="text" id="pc_bankName" placeholder="e.g. OPay, GTBank, PalmPay">
                    </div>
                </div>

                <button class="btn" onclick="generatePayCode()">
                    <i class="fas fa-bolt"></i> Generate Code
                </button>
                
                <div class="result-box" id="pc_resultBox">
                    <h3><i class="fas fa-check-circle"></i> Code Generated!</h3>
                    <p>Send this code to the user so they can complete their payment.</p>
                    <div class="code-display" id="pc_displayCode" onclick="copyCode()">------</div>
                    <div class="copy-hint"><i class="fas fa-copy"></i> Click the code to copy</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: If you host admin.html on Netlify, change this to your live server URL (e.g. "https://your-app.onrender.com")
        const SERVER_URL = ""; 

        /* ============================================================
           1. ADMIN LOGIN
           ============================================================ */
        async function loginAdmin() {
            const pin = document.getElementById("adminPin").value.trim();
            const errorEl = document.getElementById("loginError");
            const loginBtn = document.getElementById("loginBtn");
            
            if (!pin) return;

            const originalBtn = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;
            errorEl.style.display = "none";

            try {
                const res = await fetch(`${SERVER_URL}/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pin }),
                    credentials: "include"
                });

                if (res.ok) {
                    document.getElementById("loginScreen").style.display = "none";
                    document.getElementById("dashboardScreen").style.display = "block";
                    loadUsers();
                } else {
                    const data = await res.json();
                    errorEl.textContent = data.message || "Invalid Admin PIN";
                    errorEl.style.display = "block";
                }
            } catch (e) {
                errorEl.textContent = "Network error. Please check your connection.";
                errorEl.style.display = "block";
            } finally {
                loginBtn.innerHTML = originalBtn;
                loginBtn.disabled = false;
            }
        }

        async function logoutAdmin() {
            try {
                await fetch(`${SERVER_URL}/admin/logout`, { method: "POST", credentials: "include" });
            } catch(e) {}
            window.location.reload();
        }

        /* ============================================================
           2. TAB SWITCHING
           ============================================================ */
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        /* ============================================================
           3. LOAD & MANAGE USERS
           ============================================================ */
        async function loadUsers() {
            try {
                const res = await fetch(`${SERVER_URL}/admin/users`, { credentials: "include" });
                if (!res.ok) throw new Error("Failed to load");
                const data = await res.json();
                
                const tbody = document.getElementById("usersList");
                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-gray);">No users found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.users.map(u => `
                    <tr>
                        <td>${u.fullName}</td>
                        <td>${u.phone}</td>
                        <td>₦${Number(u.balance).toLocaleString()}</td>
                        <td>
                            <span class="status-badge ${u.active ? 'status-active' : 'status-inactive'}">
                                ${u.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn btn-credit" onclick="adjustBalance('${u.phone}', 'credit')">+ Credit</button>
                            <button class="action-btn btn-debit" onclick="adjustBalance('${u.phone}', 'debit')">- Debit</button>
                            ${u.active 
                                ? `<button class="action-btn btn-deactivate" onclick="toggleUser('${u.phone}', 'deactivate')">Deactivate</button>`
                                : `<button class="action-btn btn-activate" onclick="toggleUser('${u.phone}', 'activate')">Activate</button>`
                            }
                            <button class="action-btn btn-pin" onclick="changePin('${u.phone}')">Change PIN</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById("usersList").innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2rem; color: #ff6b6b;">Error loading users. Please refresh or log in again.</td></tr>`;
            }
        }

        async function adjustBalance(phone, type) {
            const amount = prompt(`Enter amount to ${type} for ${phone}:`);
            if (!amount || isNaN(amount) || Number(amount) <= 0) return;

            try {
                const res = await fetch(`${SERVER_URL}/admin/user/${type}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, amount }),
                    credentials: "include"
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert(`✅ ${data.message}`);
                    loadUsers();
                } else {
                    alert(`❌ ${data.message}`);
                }
            } catch (e) {
                alert("❌ Action failed. Network error.");
            }
        }

        async function toggleUser(phone, action) {
            if (!confirm(`Are you sure you want to ${action} user ${phone}?`)) return;

            try {
                const res = await fetch(`${SERVER_URL}/admin/user/${action}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone }),
                    credentials: "include"
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert(`✅ ${data.message}`);
                    loadUsers();
                } else {
                    alert(`❌ ${data.message}`);
                }
            } catch (e) {
                alert("❌ Action failed. Network error.");
            }
        }

        async function changePin(phone) {
            const newPin = prompt(`Enter new 6-digit PIN for ${phone}:`);
            if (!newPin) return;
            if (newPin.length !== 6 || isNaN(newPin)) {
                alert("❌ PIN must be exactly 6 digits.");
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/admin/user/changepin`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, newPin }),
                    credentials: "include"
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert(`✅ ${data.message}`);
                } else {
                    alert(`❌ ${data.message}`);
                }
            } catch (e) {
                alert("❌ Action failed. Network error.");
            }
        }

        /* ============================================================
           4. GENERATE PAY CODE
           ============================================================ */
        async function generatePayCode() {
            const username = document.getElementById("pc_username").value.trim();
            const amount = document.getElementById("pc_amount").value.trim();
            const accountNumber = document.getElementById("pc_accountNumber").value.trim();
            const accountName = document.getElementById("pc_accountName").value.trim();
            const bankName = document.getElementById("pc_bankName").value.trim();

            if (!username || !amount || !accountNumber || !accountName || !bankName) {
                alert("❌ Please fill all fields.");
                return;
            }

            const btn = event.target.closest('button');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            btn.disabled = true;

            try {
                const res = await fetch(`${SERVER_URL}/admin/generate-paycode`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, amount, accountNumber, accountName, bankName }),
                    credentials: "include"
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById("pc_displayCode").textContent = data.code;
                    document.getElementById("pc_resultBox").classList.add("active");
                    
                    // Clear form
                    document.getElementById("pc_username").value = "";
                    document.getElementById("pc_amount").value = "";
                    document.getElementById("pc_accountNumber").value = "";
                    document.getElementById("pc_accountName").value = "";
                    document.getElementById("pc_bankName").value = "";
                } else {
                    alert(`❌ ${data.message || "Failed to generate code."}`);
                }
            } catch (e) {
                alert("❌ Network error. Please try again.");
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }

        function copyCode() {
            const code = document.getElementById("pc_displayCode").textContent;
            if (code === "------") return;
            
            navigator.clipboard.writeText(code).then(() => {
                const hint = document.querySelector('.copy-hint');
                const original = hint.innerHTML;
                hint.innerHTML = '<i class="fas fa-check-circle" style="color: var(--success);"></i> Code copied!';
                setTimeout(() => { hint.innerHTML = original; }, 2000);
            });
        }

        /* ============================================================
           5. AUTO-CHECK SESSION ON LOAD
           ============================================================ */
        window.addEventListener("DOMContentLoaded", async () => {
            // Optional: Check if admin is already logged in
            try {
                const res = await fetch(`${SERVER_URL}/admin/users`, { credentials: "include" });
                if (res.ok) {
                    document.getElementById("loginScreen").style.display = "none";
                    document.getElementById("dashboardScreen").style.display = "block";
                    loadUsers();
                }
            } catch (e) {
                // Not logged in, show login screen
            }
        });
    </script>
</body>
</html>
